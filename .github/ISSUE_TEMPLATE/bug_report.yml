name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below to help us resolve the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run command '...'
        2. With options '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Messages
      description: Please copy and paste any relevant log output or error messages
      render: shell
      placeholder: Paste logs here

  - type: input
    id: version
    attributes:
      label: Agent-Builder Version
      description: What version of agent-builder are you running?
      placeholder: e.g., 0.1.0, latest
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: What version of Node.js are you using?
      placeholder: e.g., v18.0.0, v20.10.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: output-format
    attributes:
      label: Output Format
      description: Which output format were you using?
      options:
        - skill
        - mcp
        - cli
        - library
        - N/A

  - type: dropdown
    id: language
    attributes:
      label: Programming Language
      description: Which programming language were you targeting?
      options:
        - TypeScript
        - Python
        - N/A

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: If relevant, please share your configuration file (remove any sensitive data)
      render: yaml
      placeholder: Paste your .agent-builder.yaml here

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, related issues, etc.)

  - type: checkboxes
    id: search
    attributes:
      label: Search Before Posting
      description: Please confirm you've searched for existing issues
      options:
        - label: I have searched existing issues and discussions
          required: true
