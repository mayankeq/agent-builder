name: Question
description: Ask a question about using agent-builder
title: "[Question]: "
labels: ["question", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Have a question? We're here to help! For real-time discussions, consider joining our Discord community.

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
      placeholder: How do I...? What is...? Why does...?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Question Category
      description: What is your question about?
      options:
        - Installation/Setup
        - Usage/How-to
        - Configuration
        - Output Formats
        - Templates
        - Performance
        - Troubleshooting
        - Best Practices
        - Architecture/Design
        - Contributing
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide any relevant context (what you're trying to do, what you've tried, etc.)
      placeholder: |
        I'm trying to...
        I've tried...
        My goal is...

  - type: textarea
    id: code
    attributes:
      label: Code/Configuration
      description: If relevant, share your code or configuration
      render: yaml
      placeholder: |
        ```yaml
        # Your configuration or code here
        ```

  - type: input
    id: version
    attributes:
      label: Agent-Builder Version
      description: What version are you using?
      placeholder: e.g., 0.1.0

  - type: checkboxes
    id: search
    attributes:
      label: Search Before Asking
      description: Please confirm you've checked existing resources
      options:
        - label: I have checked the README and documentation
          required: true
        - label: I have searched existing issues and discussions
          required: true
